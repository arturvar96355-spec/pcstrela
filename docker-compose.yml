services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: site
      POSTGRES_USER: site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 10s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_COMPANY_SHORT: ${NEXT_PUBLIC_COMPANY_SHORT}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://site:${POSTGRES_PASSWORD}@db:5432/site
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:3000:3000" # только для команд на самом сервере
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      retries: 3

  # Разовые команды: docker compose --profile tools run --rm seed
  seed:
    profiles: ["tools"]
    build:
      context: .
      target: build
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_COMPANY_SHORT: ${NEXT_PUBLIC_COMPANY_SHORT}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://site:${POSTGRES_PASSWORD}@db:5432/site
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    command: ["pnpm", "seed"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-pcstrela.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gate:/etc/caddy/gate:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddy_data:
